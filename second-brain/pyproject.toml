[project]
name = "second-brain-vault-source"
version = "0.1.0"
description = "Test tooling for the second-brain vault source: seed templates, vault init and the golden vault"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruamel.yaml>=0.18,<0.19",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
