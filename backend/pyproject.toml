[project]
name = "second-brain-backend"
version = "0.1.0"
description = "Second brain backend: vault parser (P1-07); the Django app is added by P1-17"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# SIM300 mistakes module constants (ALL_CAPS) for literals in `assert CONSTANT == value`.
ignore = ["SIM300"]
