# Mount spike (plan section 8). Two probes over the same scratch folder.
# SPIKE_PATH comes from web-app/scripts/spike/.env. No published ports, no network.
x-probe: &probe
  image: python:3.12-slim
  command: ["sleep", "infinity"]
  network_mode: none
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

services:
  probe:
    <<: *probe
    user: "1000:1000"
    volumes:
      - ${SPIKE_PATH}:/vault
      - ./:/spike:ro
  probe_ro:
    <<: *probe
    user: "1000:1000"
    volumes:
      - ${SPIKE_PATH}:/vault:ro
      - ./:/spike:ro
