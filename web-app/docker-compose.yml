# Everything the backend reads comes from the env file named on the command line
# (`.env` by default, `.env.e2e` for the e2e project), never from `env_file:`, so one
# `--env-file` selects the whole stack.
x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in the env file}
  DJANGO_DEBUG: ${DJANGO_DEBUG:?set DJANGO_DEBUG in the env file}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in the env file}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in the env file}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the env file}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
  INDEXER_POLL_SECONDS: ${INDEXER_POLL_SECONDS:-10}
  TZ: ${TZ:-Asia/Manila}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in web-app/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in web-app/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in web-app/.env}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql (versioned subdirectory)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No published port: only other services on the Compose network reach the database.

  backend:
    build: ./backend
    image: second-brain-backend
    init: true
    # Migrate first; nothing here creates a user (the account is made by hand, decision C18).
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    environment: *django-env
    volumes:
      - "${VAULT_PATH}:/vault"
      - ./backend:/repo/web-app/backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Same image as backend; polls the vault every INDEXER_POLL_SECONDS (read-only mount).
  # Profile "indexer" keeps `up` from starting it until P1-41.
  indexer:
    build: ./backend
    image: second-brain-backend
    profiles: ["indexer"]
    command: ["python", "manage.py", "sync_vault", "--watch"]
    environment: *django-env
    volumes:
      - "${VAULT_PATH}:/vault:ro"
      - ./backend:/repo/web-app/backend
    depends_on:
      db:
        condition: service_healthy

  # Tests run here only: no /vault mount, no published port. Test-mode variables are set
  # inline, never in .env.
  test:
    build: ./backend
    image: second-brain-backend
    profiles: ["test"]
    command: ["pytest"]
    environment:
      <<: *django-env
      # The env file supplies the DB credentials; a different database name keeps pytest and
      # any stray connection away from the real index (tests use test_second_brain_test).
      POSTGRES_DB: second_brain_test
      DJANGO_SECRET_KEY: test-only-not-a-secret-test-only-not-a-secret-test-only
      SECOND_BRAIN_TEST_MODE: "1"
      SECOND_BRAIN_TODAY: "2026-10-09"
    volumes:
      - ./backend:/repo/web-app/backend
      # Vault source at the repo-relative path the parser tests resolve (see backend/Dockerfile).
      - ../second-brain:/repo/second-brain:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./dashboard
    init: true
    environment:
      TZ: ${TZ:-Asia/Manila}
      VITE_API_MODE: mock
    volumes:
      - ./dashboard:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  pgdata:
  node_modules:
