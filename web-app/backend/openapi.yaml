          items:
            type: string
        Blockers:
          type: array
          items:
            type: string
        Decisions / Updates:
          type: array
          items:
            type: string
        Follow-ups:
          type: array
          items:
            type: string
        Related Tasks / Projects:
          type: array
          items:
            type: string
      required:
      - Blockers
      - Decisions / Updates
      - Done
      - Follow-ups
      - Related Tasks / Projects
      - Today
    StandupToday:
      oneOf:
      - $ref: '#/components/schemas/StandupExisting'
      - $ref: '#/components/schemas/StandupMissing'
    StartStandupResponse:
      type: object
      properties:
        created:
          type: boolean
          description: 'True on 201: a new note with carry-forward.'
        filled:
          type: boolean
          description: An untouched note was filled (true) or a touched one returned
            unchanged.
        note:
          $ref: '#/components/schemas/NoteDetail'
        untouched:
          type: boolean
      required:
      - created
      - filled
      - note
      - untouched
    StateEnum:
      enum:
      - resolved
      - ambiguous
      - unresolved
      type: string
      description: |-
        * `resolved` - resolved
        * `ambiguous` - ambiguous
        * `unresolved` - unresolved
    StatusChangeRequest:
      type: object
      properties:
        path:
          type: string
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/NoteStatusEnum'
          description: |-
            Must belong to the vocabulary of the note's type; checked against the note.

            * `inbox` - inbox
            * `planned` - planned
            * `in-progress` - in-progress
            * `blocked` - blocked
            * `review` - review
            * `done` - done
            * `cancelled` - cancelled
            * `active` - active
            * `paused` - paused
            * `archived` - archived
            * `proposed` - proposed
            * `accepted` - accepted
            * `superseded` - superseded
            * `rejected` - rejected
            * `triaged` - triaged
            * `dismissed` - dismissed
        expected_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        evidence:
          type: string
          description: Appended under `## Notes` when the status becomes `done`.
      required:
      - expected_hash
      - path
      - status
    TriageRequest:
      type: object
      properties:
        path:
          type: string
          maxLength: 200
        expected_hash:
          type: string
          description: Checked before a target note is created, not only before the
            capture edit.
          pattern: ^[0-9a-f]{64}$
        action:
          $ref: '#/components/schemas/ActionEnum'
        classification:
          allOf:
          - $ref: '#/components/schemas/ClassificationEnum'
          description: |-
            Required for every action but `dismiss`. An action that creates a target needs a classification that files as that action (`task`/`problem` for `task`, `decision`, `learning-topic`/`note` for `lesson`, `project`); `keep` and `dismiss` take any.

            * `task` - task
            * `problem` - problem
            * `decision` - decision
            * `learning-topic` - learning-topic
            * `note` - note
            * `project` - project
            * `ticket` - ticket
            * `architecture-idea` - architecture-idea
            * `question` - question
            * `thought` - thought
        title:
          type: string
          maxLength: 200
        project:
          type: string
          maxLength: 200
        existing_target:
          type: string
          description: 'Retry after a partial failure: a vault-relative `.md` path
            of the target already created. Skips creation and only edits the capture.'
          maxLength: 200
      required:
      - action
      - expected_hash
      - path
    TriageResponse:
      type: object
      properties:
        capture:
          $ref: '#/components/schemas/NoteDetail'
        target:
          allOf:
          - $ref: '#/components/schemas/NoteSummary'
          nullable: true
          description: The note created or reused; null for `keep` and `dismiss`.
      required:
      - capture
      - target
    TypeEnum:
      enum:
      - task
      - project
      - decision
      - lesson
      type: string
      description: |-
        * `task` - task
        * `project` - project
        * `decision` - decision
        * `lesson` - lesson
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
